<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kimya 2</title><style>
:root{--bg:#0f172a;--c:#1e293b;--a:#38bdf8;--t:#e2e8f0;--g:#22c55e;--r:#ef4444}

<div id="b">Merhaba! Bir konu seç, grafik üzerinden anlatayım. 👩‍🏫</div></div>
<script>
const S=(x)=>`<svg viewBox="0 0 300 150" style="background:#0b1220;border-radius:10px">${x}</svg>`;
const ax='<path d="M30 10V130H290" stroke="#94a3b8" fill="none"/>';
const T=[
{n:"1. Lewis formülü & polarlık",say:"Merkez atomda ortaklanmamış elektron çifti varsa ya da bağlar simetrik değilse molekül polardır. Bağ polarlıkları vektör gibi toplanır; toplam sıfırsa apolar.",tips:["Önce Lewis'i çiz, ortaklanmamış çift say","Simetri varsa (BeH₂ doğrusal) apolar","Molekül dipol momenti sıfır değilse polar"],
g:S('<circle cx="150" cy="75" r="14" fill="#38bdf8"/><circle cx="60" cy="75" r="10" fill="#f472b6"/><circle cx="240" cy="75" r="10" fill="#f472b6"/><path d="M110 75H80M190 75H220" stroke="#facc15" stroke-width="3"/><text x="75" y="130" fill="#e2e8f0" font-size="12">Doğrusal: vektörler birbirini götürür → APOLAR</text>'),
q:[["Merkez atomda ortaklanmamış elektron çifti yoksa ve molekül simetrikse molekül nasıldır?","Apolar",[["Polar","Simetri varsa bağ dipolleri birbirini götürür."],["İyonik","Polarlık bağ türüyle değil geometriyle ilgili."],["Dipol momenti büyük","Simetride net dipol sıfırdır."]],"Simetrik dağılımda bağ dipolleri sıfırlanır."],["H₂O polar çünkü...","Bükülmüş yapıda, merkezde ortaklanmamış çift var",[["Doğrusal","H₂O doğrusal değil, bükülmüş."],["Bağlar apolar","O–H bağları polar."],["Elektron yok","Merkez O'da 2 ortaklanmamış çift var."]],"Bükülmüş geometri dipolleri götürmez."]]},
{n:"2. Bileşik adlandırma",say:"İyonik bileşikte metal adı aynen, ametal -ür ekiyle okunur: sodyum klorür. Kovalent bileşikte sayı ön ekleri kullanılır: mono, di, tri.",tips:["Metal+ametal = iyonik, sayı eki yok","Ametal+ametal = kovalent, di/tri/tetra","İlk elementte 'mono' yazılmaz"],
g:S('<rect x="40" y="50" width="90" height="40" fill="#38bdf8"/><text x="60" y="76">Na (metal)</text><rect x="170" y="50" width="90" height="40" fill="#f472b6"/><text x="185" y="76">Cl (ametal)</text><text x="70" y="120" fill="#e2e8f0" font-size="13">Sodyum klorür (sayı eki yok)</text>'),
q:[["N₂O hangi adla okunur?","Diazotmonoksit",[["Azot oksit","Kovalentte sayı ön eki gerekir."],["Monoazotdioksit","İlk elementte mono yazılmaz ve sayılar ters."],["Azotür","Bu iyonik adlandırma."]],"İki azot, bir oksijen → di + mono."],["Na₂S adı nedir?","Disodyum monosülfür değil, sodyum sülfür",[["Disodyum monosülfür","Metal–ametal iyonik, sayı eki kullanılmaz."],["Sodyum sülfat","Sülfat SO₄²⁻ iyonu."],["Sülfür sodyum","Sıra yanlış, metal önce."]],"İyonik bileşiklerde sayı eki yok."]]},
{n:"3. Moleküller arası etkileşimler",say:"HCl dipol-dipol, CH₄ ile HCl arasında dipol–indüklenmiş dipol, apolar moleküllerde London kuvveti vardır. Polar-polar ise dipol-dipol.",tips:["Polar+polar → dipol-dipol","Polar+apolar → dipol-indüklenmiş dipol","Apolar+apolar → London"],
g:S('<circle cx="80" cy="75" r="22" fill="#38bdf8"/><circle cx="220" cy="75" r="22" fill="#f472b6"/><path d="M102 75H198" stroke="#facc15" stroke-dasharray="6"/><text x="90" y="125" fill="#e2e8f0" font-size="12">HCl ··· HCl : dipol-dipol</text>'),
q:[["HCl ile CH₄ arasında hangi etkileşim vardır?","Dipol–indüklenmiş dipol",[["Dipol–dipol","CH₄ apolar, kalıcı dipolü yok."],["İyon–dipol","İyon yok."],["Hidrojen bağı","H, F/O/N'e bağlı değil."]],"Polar + apolar karışımı."],["Apolar moleküller arasında yalnızca ne vardır?","London kuvveti",[["Dipol–dipol","Kalıcı dipol yok."],["Hidrojen bağı","Şartları yok."],["İyonik bağ","Molekül içi değil."]],"Anlık dipoller London kuvvetini oluşturur."]]},
{n:"4. Kristal katılar & iletkenlik",say:"Metalik katı elektriği iyi iletir. İyonik katı katıyken iletmez çünkü iyonlar sabittir, sıvı ya da çözeltisinde iletir.",tips:["Metaller her halde iletken","İyonik katı: katı hâl yalıtkan","İyonik: erimiş/sulu çözelti iletken"],
g:S(ax+'<path d="M30 120H100V40H290" stroke="#22c55e" fill="none" stroke-width="3"/><text x="110" y="30" fill="#22c55e" font-size="12">İyonik: erimiş hâl iletir</text><text x="40" y="115" fill="#94a3b8" font-size="12">katı: ~0</text>'),
q:[["Katı NaCl elektriği neden iletmez?","İyonlar hareket edemez",[["Elektron yok","İyonlar var ama sabit."],["Metaldir","NaCl iyonik bileşiktir."],["Apolar","Bu kavram uygun değil."]],"Serbest yük taşıyıcı yok."],["İyonik katı hangi durumda iletken olur?","Suda çözününce",[["Isınmadan","Katı hâlde iletmez."],["Hiçbir zaman","Çözelti ve eriyik iletir."],["Sadece buharda","Buhar iletken değil."]],"İyonlar serbest kalır."]]},
{n:"5. Sıvı & buhar basıncı",say:"Buhar basıncı sıvının cinsine ve sıcaklığa bağlıdır. Sıvı miktarına, kap şekline, kap hacmine bağlı değildir.",tips:["Bağlı: cins, sıcaklık","Bağlı değil: miktar, kap şekli","Dış basınca bağlı değildir"],
g:S(ax+'<path d="M30 120Q100 110 150 80T290 15" stroke="#38bdf8" fill="none" stroke-width="3"/><text x="40" y="30" fill="#e2e8f0" font-size="12">Sıcaklık↑ → Buhar basıncı↑</text>'),
q:[["Buhar basıncı hangisine bağlı DEĞİLDİR?","Sıvı miktarı",[["Sıcaklık","Doğrudan etkiler."],["Sıvının cinsi","Etkiler."],["Moleküller arası çekim","Etkiler."]],"Miktar etkili değildir."],["Sıcaklık artarsa buhar basıncı?","Artar",[["Azalır","Daha fazla molekül buharlaşır."],["Değişmez","Sıcaklığa bağlıdır."],["Önce artıp azalır","Sürekli artar."]],"Kinetik enerji artar."]]},
{n:"6. Buhar basıncı–sıcaklık grafiği",say:"Grafikte aynı sıcaklıkta eğrisi altta kalan sıvının buhar basıncı düşüktür, kaynama noktası yüksektir. Dış basınca ulaştığı sıcaklıkta kaynar.",tips:["Yatay çizgi = dış basınç","Eğriyi kestiği sıcaklık = kaynama","Eğri aşağıda → çekim kuvvetli"],
g:S(ax+'<path d="M30 125Q120 110 180 60T290 15" stroke="#38bdf8" fill="none" stroke-width="3"/><path d="M30 125Q140 120 230 80T290 40" stroke="#f472b6" fill="none" stroke-width="3"/><path d="M30 50H290" stroke="#facc15" stroke-dasharray="5"/><text x="40" y="45" fill="#facc15" font-size="11">101,3 kPa</text>'),
q:[["Aynı sıcaklıkta buhar basıncı en düşük olan sıvının kaynama noktası?","En yüksek",[["En düşük","Basınç düşük → zor buharlaşır → geç kaynar."],["Aynı","Eğriler farklı."],["Belirsiz","Grafikten belli."]],"Düşük eğri = güçlü çekim."],["Açık hava basıncında sıvı ne zaman kaynar?","Buhar basıncı dış basınca eşit olunca",[["0°C'de","Sıvıya bağlı."],["Hacim artınca","İlgisiz."],["Her zaman","Hayır."]],"Kaynama tanımı."]]},
{n:"7. Kaynama noktası & H bağı",say:"Hidrojen bağı sayısı arttıkça kaynama noktası artar. Gliserin 3 OH taşıdığı için en çok bağ yapar ve en yüksek kaynama noktasına sahiptir.",tips:["OH sayısı ↑ → H bağı ↑","Kütle de London'ı artırır","Viskozite de H bağıyla artar"],
g:S('<text x="30" y="40" fill="#e2e8f0">Propil alkol  ▇ (1 OH)</text><text x="30" y="80" fill="#e2e8f0">Propilen glikol ▇▇ (2 OH)</text><text x="30" y="120" fill="#e2e8f0">Gliserin ▇▇▇ (3 OH)</text>'),
q:[["Gliserin, propil alkol ve propilen glikolden en yüksek kaynama noktası hangisinde?","Gliserin",[["Propil alkol","Yalnız 1 OH."],["Propilen glikol","2 OH, gliserinden az."],["Hepsi eşit","OH sayıları farklı."]],"3 OH → en çok H bağı."],["Viskozitesi en büyük olan?","Gliserin",[["Propil alkol","En az H bağı."],["Propilen glikol","Ortada."],["Fark yok","Var."]],"Daha çok H bağı, daha akışkan değil."]]},
{n:"8. Yüzey gerilimi",say:"Sıvı yüzeyindeki moleküller yalnızca yanlardan ve alttan çekilir; bu yüzey gerilimini oluşturur. Kohezyon güçlü olan sıvıda yüzey gerilimi büyüktür. Civa suya göre daha büyüktür.",tips:["Yüzey gerilimi ↑ → kohezyon ↑","Civa > su","Adezyon: sıvı–kap çekimi"],
g:S('<rect x="20" y="70" width="260" height="70" fill="#0ea5e9" opacity=".5"/><circle cx="150" cy="70" r="8" fill="#fff"/><path d="M150 70L130 90M150 70L170 90M150 70L150 100" stroke="#facc15"/><text x="30" y="30" fill="#e2e8f0" font-size="12">Yüzey molekülü içe doğru çekilir</text>'),
q:[["Hangisi yüzey gerilimi büyük olan sıvıda doğrudur?","Kohezyon kuvvetleri büyüktür",[["Adezyon büyük","Yüzey gerilimi kohezyonla ilgili."],["Hacim büyük","Hacim ilgisiz."],["Buhar basıncı yüksek","Genelde düşük olur."]],"Moleküller birbirini güçlü çeker."],["Civanın kohezyonu?","Adezyonundan büyüktür",[["Küçüktür","Civa damla olur."],["Eşit","Cam duvarı ıslatmaz."],["Su kadar","Daha büyük."]],"Bu yüzden küre şeklinde toplanır."]]},
{n:"9. Yüzey gerilimini etkileyen faktörler",say:"Sıcaklık arttıkça yüzey gerilimi azalır. Deterjan ekleyince de azalır. Kabın şekli, yüzey alanı ve miktar etkili değildir.",tips:["Sıcaklık↑ → gerilim↓","Deterjan → gerilim↓","Kap şekli etkisiz"],
g:S(ax+'<path d="M30 20L290 115" stroke="#f472b6" stroke-width="3"/><text x="120" y="40" fill="#e2e8f0" font-size="12">Sıcaklık↑ → yüzey gerilimi↓</text>'),
q:[["Hangisi yüzey gerilimini etkilemez?","Kabın şekli",[["Sıcaklık","Etkiler."],["Deterjan","Etkiler."],["Sıvı cinsi","Etkiler."]],"Kap şekli etkisizdir."],["Suya sabun katılırsa yüzey gerilimi?","Azalır",[["Artar","Sabun gerilimi düşürür."],["Değişmez","Düşer."],["Sıfırlanır","Tamamen sıfır olmaz."]],"Yüzey aktif madde."]]},
{n:"10. AgNP / boyut & etki",say:"Aynı kütlede küçük taneciklerin yüzey alanı daha büyüktür; mikroorganizmalarla daha çok temas eder, etkisi artar. Yani en küçük çaplı AgNP en etkilidir.",tips:["Küçük tanecik → yüzey alanı büyük","Daha çok temas → daha etkili","Aynı miktarda kıyasla"],
g:S('<circle cx="70" cy="75" r="40" fill="#94a3b8"/><circle cx="190" cy="75" r="14" fill="#38bdf8"/><circle cx="225" cy="60" r="14" fill="#38bdf8"/><circle cx="225" cy="95" r="14" fill="#38bdf8"/><circle cx="260" cy="75" r="14" fill="#38bdf8"/><text x="40" y="140" fill="#e2e8f0" font-size="12">Küçük parçacıklar → büyük toplam yüzey</text>'),
q:[["Aynı miktarda hangi AgNP daha etkilidir?","En küçük çaplı",[["En büyük çaplı","Yüzey alanı daha az."],["Hepsi eşit","Fark var."],["Yuvarlak olmayan","Boyutla ilgili."]],"Yüzey alanı/hacim oranı büyür."],["Parçalanınca yüzey alanı?","Artar",[["Azalır","Toplam yüzey artar."],["Değişmez","Artar."],["Sıfır","Hayır."]],"Daha fazla temas."]]}];
const $=id=>document.getElementById(id),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let sc=0,tot=0;
function say(t){$("b").textContent=t;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="tr-TR";speechSynthesis.speak(u)}catch(e){}}
function home(){$("app").innerHTML=`<h2>Kimya 2 🧪</h2><div class=card>Skor: ${sc}/${tot}</div>`+T.map((t,i)=>`<button class=opt onclick=topic(${i})>${t.n}</button>`).join("")+`<button onclick=quiz(-1)>🎲 Karışık soru</button>`}
function topic(i){const t=T[i];$("app").innerHTML=`<button onclick=home()>←</button><h3>${t.n}</h3><div class=card>${t.g}</div><div class=card><b>İpuçları</b><ul>${t.tips.map(x=>"<li>"+x+"</li>").join("")}</ul><button onclick="say(T[${i}].say)">👩‍🏫 Anlat</button></div><div class=card><b>Mikro kart:</b> ${t.say}</div><button onclick=quiz(${i})>Soru çöz</button>`;say(t.say)}
function quiz(i){const k=i<0?Math.floor(Math.random()*10):i,t=T[k],q=t.q[Math.floor(Math.random()*t.q.length)];
const o=sh([[q[1],"Doğru",1],...q[2].map(w=>[w[0],w[1],0])]);
$("app").innerHTML=`<button onclick=home()>←</button><div class=card><small>${t.n}</small><p>${q[0]}</p><div id=o>${o.map((x,j)=>`<button class=opt id=o${j} onclick=ans(${j})>${x[0]}</button>`).join("")}</div><div id=r></div></div><button onclick=quiz(${i})>Sonraki (rastgele)</button><button onclick=topic(${k})>Konuyu anlat</button>`;
window.cur={o,q,k}}
function ans(j){const{o,q}=cur;tot++;const d=o[j][2];if(d)sc++;o.forEach((x,m)=>{$("o"+m).disabled=true;if(x[2])$("o"+m).classList.add("ok");else if(m==j)$("o"+m).classList.add("no")});
$("r").innerHTML=`<p>${d?"✅ Doğru!":"❌ Yanlış."} ${q[3]}</p><button onclick=wr()>Yanlışlara bak</button><div id=w></div>`;say(q[3])}
function wr(){$("w").innerHTML=cur.o.filter(x=>!x[2]).map(x=>`<p>❌ <b>${x[0]}</b>: ${x[1]}</p>`).join("")}
home();
</script><script>
const R=a=>a[Math.floor(Math.random()*a.length)],pickN=(a,n)=>sh(a).slice(0,n),G=[];
const M=[["BeH₂","doğrusal, simetrik","Apolar"],["CO₂","doğrusal","Apolar"],["BF₃","düzlem üçgen","Apolar"],["CH₄","düzgün dörtyüzlü","Apolar"],["CCl₄","düzgün dörtyüzlü","Apolar"],["Cl₂","aynı atomlu","Apolar"],["H₂O","bükülmüş","Polar"],["NH₃","üçgen piramit","Polar"],["HCl","farklı atomlu doğrusal","Polar"],["SO₂","bükülmüş","Polar"],["H₂S","bükülmüş","Polar"],["CH₃Cl","simetrik olmayan dörtyüzlü","Polar"]];
G[0]=()=>{let[f,g,a]=R(M),b=a=="Polar"?"Apolar":"Polar";return[`${f} molekülü nasıldır?`,a,[[b,`${f}: ${g} yapı, dipol momenti ${a=="Polar"?"sıfır değildir":"sıfırdır"}.`],["İyonik","Polarlık iyonik demek değildir."]],`${f} ${g} olduğundan ${a.toLowerCase()}dır.`]};
const N=[["NaCl","sodyum klorür"],["K₂S","potasyum sülfür"],["CaO","kalsiyum oksit"],["MgBr₂","magnezyum bromür"],["Al₂O₃","alüminyum oksit"],["CaF₂","kalsiyum florür"],["Li₂O","lityum oksit"],["CO","karbonmonoksit"],["CO₂","karbondioksit"],["N₂O","diazotmonoksit"],["SO₃","kükürttrioksit"],["PCl₃","fosfortriklorür"],["CCl₄","karbontetraklorür"],["NO₂","azotdioksit"],["N₂O₃","diazottrioksit"]];
G[1]=()=>{let c=R(N),o=pickN(N.filter(x=>x!=c),3);return[`${c[0]} bileşiğinin adı nedir?`,c[1],o.map(x=>[x[1],`Bu ${x[0]} bileşiğinin adı.`]),`${c[0]}: ${c[1]}. `+(N.indexOf(c)<7?"Metal+ametal → iyonik, sayı eki yok.":"Ametal+ametal → kovalent, sayı ön ekleri kullanılır.")]};
const I=[["HCl–HCl","Dipol–dipol"],["CH₃Cl–CH₃Cl","Dipol–dipol"],["CH₄–CH₄","London"],["CO₂–CO₂","London"],["Br₂–Br₂","London"],["N₂–N₂","London"],["HCl–CH₄","Dipol–indüklenmiş dipol"],["HCl–Ar","Dipol–indüklenmiş dipol"],["H₂O–H₂O","Hidrojen bağı"],["NH₃–NH₃","Hidrojen bağı"],["HF–HF","Hidrojen bağı"],["Na⁺–H₂O","İyon–dipol"],["NaCl–H₂O","İyon–dipol"]],IT=["Dipol–dipol","London","Dipol–indüklenmiş dipol","Hidrojen bağı","İyon–dipol"];
G[2]=()=>{let c=R(I);return[`${c[0]} arasında baskın etkileşim hangisidir?`,c[1],pickN(IT.filter(x=>x!=c[1]),3).map(x=>[x,`${c[0]} için ${x} koşulları sağlanmaz.`]),`${c[0]} → ${c[1]}.`]};
const K=[["Na","Metalik"],["Cu","Metalik"],["Fe","Metalik"],["Mg","Metalik"],["NaCl","İyonik"],["KBr","İyonik"],["MgO","İyonik"],["CaCl₂","İyonik"]];
G[3]=()=>{let c=R(K),m=c[1]=="Metalik";if(Math.random()<.5)return[`Katı ${c[0]} elektriği iletir mi?`,m?"İletir":"İletmez",[[m?"İletmez":"İletir",m?"Metallerde serbest elektronlar vardır.":"Katıda iyonlar sabittir."]],m?"Metal: serbest elektron var.":"İyonik katı: iyonlar hareket edemez."];return[`${c[0]} hangi kristal katı türündedir?`,c[1],["Metalik","İyonik","Kovalent","Moleküler"].filter(x=>x!=c[1]).map(x=>[x,`${c[0]} bu türden değil.`]),`${c[0]}: ${c[1]} katı.`]};
const F=(P,s)=>()=>{let c=R(P);return[`${c[0]}, ${s} etkiler mi?`,c[1]?"Evet":"Hayır",[[c[1]?"Hayır":"Evet",c[1]?`${c[0]} etkili bir faktördür.`:`${c[0]} etkisizdir.`]],`${c[0]} ${c[1]?"etkili bir faktördür":"etkili değildir"}.`]};
